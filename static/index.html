<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メモ帳</title>
<link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; height: 100dvh; display: flex; overflow: hidden; }

  /* ── Sidebar ── */
  #sidebar {
    width: 240px; min-width: 240px; background: #f7f7f5; display: flex;
    flex-direction: column; border-right: 1px solid #e8e8e6;
    transition: transform 0.25s ease; z-index: 100;
  }
  #sidebar-header { padding: 16px 12px 8px; display: flex; align-items: center; justify-content: space-between; }
  #sidebar-title { font-size: 0.85rem; font-weight: 600; color: #888; letter-spacing: 0.05em; }
  #new-btn {
    display: flex; align-items: center; gap: 4px;
    background: none; border: none; color: #555; cursor: pointer;
    font-size: 0.85rem; padding: 4px 8px; border-radius: 4px;
  }
  #new-btn:hover { background: #e8e8e6; }
  #note-list { flex: 1; overflow-y: auto; padding: 4px 0; }
  .note-item {
    padding: 8px 14px; cursor: pointer; border-radius: 4px;
    margin: 1px 6px; display: flex; align-items: center; gap: 8px;
  }
  .note-item:hover { background: #e8e8e6; }
  .note-item.active { background: #e3e3e0; }
  .note-item .note-icon { font-size: 1rem; flex-shrink: 0; }
  .note-item-info { overflow: hidden; }
  .note-item .note-title { font-size: 0.875rem; color: #37352f; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note-item .note-date { font-size: 0.7rem; color: #999; margin-top: 2px; }
  .empty { padding: 20px 14px; color: #aaa; font-size: 0.85rem; }

  /* ── Main ── */
  #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #topbar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px; border-bottom: 1px solid #f0f0ee; min-height: 48px;
  }
  #menu-btn {
    display: none; background: none; border: none; cursor: pointer;
    font-size: 1.2rem; padding: 4px; color: #555; border-radius: 4px;
  }
  #menu-btn:hover { background: #f0f0ee; }
  #save-status { font-size: 0.8rem; color: #aaa; margin-left: auto; }
  #delete-btn {
    background: none; border: 1px solid #e0e0de; color: #999;
    padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 0.85rem;
  }
  #delete-btn:hover { background: #fff0f0; border-color: #e74c3c; color: #e74c3c; }

  #editor-wrap { flex: 1; overflow-y: auto; padding: 40px max(40px, calc(50% - 360px)); }
  #title-input {
    width: 100%; border: none; outline: none; font-size: 2rem;
    font-weight: 700; color: #37352f; margin-bottom: 20px;
    line-height: 1.3; resize: none; background: transparent;
    font-family: inherit;
  }
  #title-input::placeholder { color: #c8c7c3; }

  /* Quill overrides */
  .ql-container { border: none !important; font-size: 1rem; }
  .ql-toolbar { border: none !important; border-bottom: 1px solid #f0f0ee !important; background: #fafaf9; }
  .ql-editor { padding: 0 !important; min-height: 300px; color: #37352f; line-height: 1.75; }
  .ql-editor p { margin-bottom: 4px; }
  .ql-editor.ql-blank::before { color: #c8c7c3; font-style: normal; left: 0; }
  .ql-cb { cursor: pointer; font-size: 1.1em; margin-right: 6px; user-select: none; }
  .ql-cb[data-checked="true"] { color: #2eaadc; }

  #placeholder-screen {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; color: #ccc; gap: 12px;
  }
  #placeholder-screen .ph-icon { font-size: 3rem; }
  #placeholder-screen p { font-size: 0.95rem; }

  /* ── Mobile overlay ── */
  #overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.3); z-index: 90;
  }

  @media (max-width: 640px) {
    #sidebar {
      position: fixed; top: 0; left: 0; bottom: 0;
      transform: translateX(-100%);
    }
    #sidebar.open { transform: translateX(0); }
    #menu-btn { display: block; }
    #overlay.show { display: block; }
    #editor-wrap { padding: 24px 20px; }
    #title-input { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<div id="overlay" onclick="closeSidebar()"></div>

<!-- Sidebar -->
<div id="sidebar">
  <div id="sidebar-header">
    <span id="sidebar-title">ページ</span>
    <button id="new-btn" onclick="newNote()">＋ 新規</button>
  </div>
  <div id="note-list"></div>
</div>

<!-- Main -->
<div id="main">
  <div id="topbar">
    <button id="menu-btn" onclick="toggleSidebar()">☰</button>
    <span id="save-status"></span>
    <button id="delete-btn" onclick="deleteNote()" style="display:none">削除</button>
  </div>

  <div id="placeholder-screen">
    <div class="ph-icon">📝</div>
    <p>左のリストからページを選ぶか、新規作成してください</p>
    <button id="new-btn2" onclick="newNote()" style="background:#2eaadc;color:white;border:none;padding:8px 18px;border-radius:4px;cursor:pointer;font-size:0.9rem;">＋ 新規ページ</button>
  </div>

  <div id="editor-area" style="display:none;flex:1;display:none;flex-direction:column;overflow:hidden;">
    <div id="toolbar">
      <span class="ql-formats">
        <button class="ql-bold"></button>
      </span>
      <span class="ql-formats">
        <button id="cb-btn" title="チェックボックス" onclick="insertCheckbox()">☐</button>
      </span>
    </div>
    <div id="editor-wrap">
      <textarea id="title-input" placeholder="タイトルなし" rows="1" oninput="autoResize(this)"></textarea>
      <div id="quill-editor"></div>
    </div>
  </div>
</div>

<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
<script>
// ── Checkbox Blot ─────────────────────────────────────────────────────────────
const Embed = Quill.import('blots/embed');
class CheckboxBlot extends Embed {
  static create(checked) {
    const node = super.create();
    node.dataset.checked = checked ? 'true' : 'false';
    node.textContent = checked ? '☑' : '☐';
    return node;
  }
  static value(node) { return node.dataset.checked === 'true'; }
}
CheckboxBlot.blotName = 'checkbox';
CheckboxBlot.tagName = 'span';
CheckboxBlot.className = 'ql-cb';
Quill.register(CheckboxBlot);

let notes = [];
let currentId = null;
let quill;
let autoSaveTimer = null;

// ── Init ──────────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  quill = new Quill('#quill-editor', {
    theme: 'snow',
    modules: { toolbar: '#toolbar' },
    placeholder: '書き始めましょう…'
  });

  // 自動保存：入力が止まって1秒後に保存
  quill.on('text-change', scheduleAutoSave);
  document.getElementById('title-input').addEventListener('input', scheduleAutoSave);

  // チェックボックスのクリックでON/OFF切り替え
  quill.root.addEventListener('click', e => {
    if (e.target.classList.contains('ql-cb')) {
      const checked = e.target.dataset.checked === 'true';
      e.target.dataset.checked = String(!checked);
      e.target.textContent = checked ? '☐' : '☑';
      scheduleAutoSave();
    }
  });

  loadNotes();
});

function insertCheckbox() {
  const range = quill.getSelection(true);
  // 行頭に移動してチェックボックスを挿入
  const [line, offset] = quill.getLine(range.index);
  const lineStart = range.index - offset;
  quill.insertEmbed(lineStart, 'checkbox', false, Quill.sources.USER);
  quill.setSelection(lineStart + 1, Quill.sources.SILENT);
}

function scheduleAutoSave() {
  clearTimeout(autoSaveTimer);
  setStatus('未保存…');
  autoSaveTimer = setTimeout(saveNote, 1000);
}

// ── API ───────────────────────────────────────────────────────────────────────
async function loadNotes() {
  const res = await fetch('/api/notes');
  notes = await res.json();
  renderList();
}

function renderList() {
  const el = document.getElementById('note-list');
  if (notes.length === 0) {
    el.innerHTML = '<div class="empty">ページがありません</div>';
    return;
  }
  el.innerHTML = notes.map(n => `
    <div class="note-item ${n.id === currentId ? 'active' : ''}" onclick="openNote('${n.id}')">
      <span class="note-icon">📄</span>
      <div class="note-item-info">
        <div class="note-title">${escHtml(n.title || 'タイトルなし')}</div>
        <div class="note-date">${formatDate(n.updated_at)}</div>
      </div>
    </div>
  `).join('');
}

function openNote(id) {
  const note = notes.find(n => n.id === id);
  if (!note) return;
  currentId = id;
  document.getElementById('title-input').value = note.title;
  autoResize(document.getElementById('title-input'));
  try { quill.setContents(JSON.parse(note.content)); }
  catch { quill.setText(note.content); }
  showEditor();
  renderList();
  closeSidebar();
}

function newNote() {
  currentId = null;
  document.getElementById('title-input').value = '';
  quill.setContents([]);
  showEditor();
  renderList();
  closeSidebar();
  document.getElementById('title-input').focus();
}

async function saveNote() {
  const title = document.getElementById('title-input').value.trim() || 'タイトルなし';
  const content = JSON.stringify(quill.getContents());
  setStatus('保存中…');

  if (currentId) {
    await fetch(`/api/notes/${currentId}`, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({title, content})
    });
  } else {
    const res = await fetch('/api/notes', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({title, content})
    });
    const data = await res.json();
    currentId = data.id;
  }
  setStatus('保存済み ✓');
  await loadNotes();
  setTimeout(() => setStatus(''), 2000);
}

async function deleteNote() {
  if (!currentId) return;
  if (!confirm('このページを削除しますか？')) return;
  await fetch(`/api/notes/${currentId}`, {method: 'DELETE'});
  currentId = null;
  hideEditor();
  await loadNotes();
}

// ── UI helpers ────────────────────────────────────────────────────────────────
function showEditor() {
  document.getElementById('placeholder-screen').style.display = 'none';
  const ea = document.getElementById('editor-area');
  ea.style.display = 'flex';
  ea.style.flexDirection = 'column';
  ea.style.flex = '1';
  ea.style.overflow = 'hidden';
  document.getElementById('delete-btn').style.display = currentId ? '' : 'none';
}

function hideEditor() {
  document.getElementById('placeholder-screen').style.display = '';
  document.getElementById('editor-area').style.display = 'none';
  document.getElementById('delete-btn').style.display = 'none';
}

function setStatus(msg) {
  document.getElementById('save-status').textContent = msg;
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDate(iso) {
  const d = new Date(iso);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

// Enterキーでタイトルからエディタへ移動
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('title-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); quill.focus(); }
  });
});
</script>
</body>
</html>
